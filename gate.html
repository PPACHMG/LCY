<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LCY · 访问验证</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%237FB35A'>L</text></svg>">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#EFEDE3; --ink:#2A2826; --ink2:#6B6660;
  --apple:#7FB35A; --apple-d:#5E8F3E; --line:#C9C4B6; --card:#FBFAF5;
}
*{margin:0;padding:0;box-sizing:border-box}
html.no-native-cursor, html.no-native-cursor *{cursor:none!important}
body{font-family:"Noto Serif SC","Cormorant Garamond",serif;
  background:linear-gradient(160deg,#EFEDE3 0%,#E2E8D5 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  color:var(--ink);padding:20px}
.card{width:min(92vw,380px);padding:48px 38px;border-radius:22px;text-align:center;
  background:var(--card);border:1px solid var(--line);
  box-shadow:0 20px 60px rgba(60,70,40,.12)}
.mark{font-family:"Cormorant Garamond",serif;font-size:12px;letter-spacing:.4em;
  color:var(--apple-d);text-transform:uppercase;margin-bottom:16px}
h1{font-family:"Cormorant Garamond","Noto Serif SC",serif;font-size:26px;font-weight:600;margin-bottom:8px}
p{font-size:13px;color:var(--ink2);margin-bottom:28px;line-height:1.7}
input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line);
  background:#fff;font-family:inherit;font-size:15px;text-align:center;outline:none;
  transition:border-color .3s,box-shadow .3s}
input:focus{border-color:var(--apple);box-shadow:0 0 0 3px rgba(127,179,90,.18)}
button{margin-top:14px;width:100%;padding:14px;border:none;border-radius:12px;cursor:pointer;
  background:linear-gradient(135deg,#8FC468,#6FA34E);color:#fff;font-family:inherit;
  font-size:15px;letter-spacing:.1em;transition:transform .2s,box-shadow .2s}
button:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(127,179,90,.3)}
.err{color:#C0574F;font-size:12.5px;margin-top:14px;min-height:18px}
.shake{animation:sh .4s}
@keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.cursor-dot,.cursor-ring{position:fixed;top:0;left:0;pointer-events:none;border-radius:50%;z-index:100001;opacity:0}
.cursor-dot{width:8px;height:8px;background:var(--apple);box-shadow:0 0 10px rgba(127,179,90,.65)}
.cursor-ring{width:36px;height:36px;border:1px solid rgba(127,179,90,.5);transition:width .25s,height .25s,border-color .3s,background .3s}
html.cursor-active .cursor-dot,html.cursor-active .cursor-ring{opacity:1}
.cursor-ring.hovering{width:58px;height:58px;border-color:var(--apple);background:rgba(127,179,90,.08)}
@media(pointer:coarse){.cursor-dot,.cursor-ring{display:none}}
</style>
</head>
<body>
<div class="card">
  <div class="mark">LCY · Portfolio</div>
  <h1>欢迎光临</h1>
  <p>此作品集受保护，请输入访问密码</p>
  <input type="password" id="pw" placeholder="请输入密码" autocomplete="off">
  <button id="btn">进入作品集</button>
  <div class="err" id="err"></div>
</div>
<div class="cursor-dot" aria-hidden="true"></div>
<div class="cursor-ring" aria-hidden="true"></div>
<script>
var PWD='123456LCYZPJ';
var input=document.getElementById('pw'),btn=document.getElementById('btn'),err=document.getElementById('err');
function check(){
  var v=(input.value||'').trim();
  if(v===PWD){
    try{sessionStorage.setItem('lcy_auth','1');}catch(e){}
    location.href='index.html';
  }else{
    err.textContent='密码不正确，请重试';
    var c=document.querySelector('.card');
    c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');
    input.select();
  }
}
btn.addEventListener('click',check);
input.addEventListener('keydown',function(e){if(e.key==='Enter')check();});
input.focus();

/* 双层光标 + 磁吸 */
(function(){
  var fine=window.matchMedia&&window.matchMedia('(pointer:fine)').matches;
  if(!fine) return;
  document.documentElement.classList.add('no-native-cursor','cursor-active');
  var dot=document.querySelector('.cursor-dot'),ring=document.querySelector('.cursor-ring');
  if(!dot||!ring) return;
  var mx=innerWidth/2,my=innerHeight/2,rx=mx,ry=my;
  window.addEventListener('mousemove',function(e){
    mx=e.clientX;my=e.clientY;
    dot.style.left=mx+'px';dot.style.top=my+'px';
    var hit=e.target&&e.target.closest&&e.target.closest('input,button');
    ring.classList.toggle('hovering',!!hit);
  },{passive:true});
  (function loop(){rx+=(mx-rx)*0.16;ry+=(my-ry)*0.16;
    ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(loop);})();
  btn.addEventListener('mousemove',function(e){
    var r=btn.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
    btn.style.transform='translate('+(dx*0.2)+'px,'+(dy*0.2)+'px)';
  });
  btn.addEventListener('mouseleave',function(){btn.style.transform='';});
})();
</script>
</body>
</html>
